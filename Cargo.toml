[workspace]
members = [
  "crates/core-types",
  "crates/core-bus",
  "crates/core-domain",
  "crates/core-engine",
  "crates/backtest",
  "crates/adapters-hyperliquid",
  "crates/adapters-lighter",
  "crates/monitoring",
  "crates/persistence",
  "crates/pybridge",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# HTTP/WebSocket
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
axum = "0.7"
hyper = "1.3"

# Data formats
csv = "1.3"
parquet = { version = "53.0", features = ["async"] }
arrow = "53.0"

# Utilities
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"

# Crypto (for venue auth)
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
