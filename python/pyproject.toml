[project]
name = "neleus"
version = "0.1.0"
description = "Python user layer for the Neleus trading framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neleus Team"}
]
keywords = ["trading", "backtesting", "crypto", "quantitative", "hyperliquid", "lighter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Optional: PyYAML for config file support
]

[project.optional-dependencies]
config = [
    "pyyaml>=6.0",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
ui = [
    "plotly>=5.18",
    "pandas>=2.0",
]
all = [
    "neleus[config,dev,ui]",
]

[project.scripts]
neleus = "neleus.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-org/neleus"
Documentation = "https://github.com/your-org/neleus#readme"
Repository = "https://github.com/your-org/neleus"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["neleus*"]

[tool.setuptools.package-data]
"neleus.ui" = ["*.html", "*.css", "*.js"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
