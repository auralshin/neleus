[project]
name = "neleus"
version = "0.1.0"
description = "Python user layer for the Neleus trading framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Neleus Team"}
]
keywords = ["trading", "backtesting", "crypto", "quantitative", "hyperliquid", "lighter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
ui = [
    "plotly>=5.18",
    "pandas>=2.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "maturin>=1.0",
]

all = [
    "neleus[ui,dev]",
]

[project.scripts]
neleus = "neleus.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-org/neleus"
Documentation = "https://github.com/your-org/neleus#readme"
Repository = "https://github.com/your-org/neleus"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Path to Cargo.toml for the Rust extension
manifest-path = "../crates/pybridge/Cargo.toml"
# Python source directory
python-source = "."
# Module name must match the #[pymodule] name in Rust
module-name = "neleus.neleus_core"
# Include additional files
include = ["neleus/ui/*.html", "neleus/ui/*.css", "neleus/ui/*.js"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
