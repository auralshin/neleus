[package]
name = "neleus"
version = "0.1.14"
edition.workspace = true
license.workspace = true

[lib]
name = "neleus_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
neleus-core-types = { path = "../core-types" }
neleus-core-bus = { path = "../core-bus" }
neleus-core-domain = { path = "../core-domain" }
neleus-core-engine = { path = "../core-engine" }
neleus-backtest = { path = "../backtest" }
neleus-adapters-hyperliquid = { path = "../adapters-hyperliquid" }
neleus-persistence = { path = "../persistence" }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
