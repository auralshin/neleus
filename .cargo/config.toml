# Cross-compilation configuration for aarch64 Linux
# Fixes ring v0.17.x build failure on Linux aarch64:
#   "ARM assembler must define __ARM_ARCH"
# The cc crate reads CFLAGS_{target} env vars to add extra flags when
# compiling C/assembly files. Setting this at the cargo config level
# ensures the flag is available inside Docker containers (e.g. manylinux).
# -march=armv8-a sets the architecture; -D__ARM_ARCH=8 explicitly defines
# the macro that ring's asm_base.h requires, because some cross-compiler
# versions inside manylinux containers do not define it automatically.
#
# NOTE: The linker for aarch64-unknown-linux-gnu is intentionally NOT set
# here. It is configured via CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
# in CI only (see .github/workflows/build-wheels.yml). This avoids breaking
# developers who build natively on aarch64 Linux, where the default system
# linker (gcc/cc) should be used instead of the cross-compiler name.

[env]
# Required for ring v0.17.x cross-compilation to aarch64-unknown-linux-gnu.
# -march=armv8-a: sets the CPU architecture for the cross-compiler.
# -D__ARM_ARCH=8: ring's asm_base.h requires __ARM_ARCH to be defined;
#   some cross-compiler versions in manylinux containers do not define it
#   automatically even with -march=armv8-a, so we define it explicitly.
# force = true so it takes effect even if the env var is already set.
CFLAGS_aarch64_unknown_linux_gnu = { value = "-march=armv8-a -D__ARM_ARCH=8", force = true }
