name: Build Binary Wheels
# Automated cross-platform wheel building
# Produces binary-only distributions protecting Rust IP

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional)'
        required: false

jobs:
  build-wheels:
    name: Build on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install maturin
        run: pip install maturin
      
      - name: Build wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          cd python
          maturin build --release --strip --out dist
      
      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          cd python
          maturin build --release --strip --out dist
        shell: cmd
      
      - name: Verify no source code in wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          cd python
          for wheel in dist/*.whl; do
            echo "Checking $wheel for source code..."
            unzip -l "$wheel" | grep -E '\.rs$|Cargo\.toml' && {
              echo "ERROR: Rust source found in wheel!"
              exit 1
            } || {
              echo "✓ Clean - no source code detected"
            }
          done
      
      - name: Verify no source code in wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          cd python
          $wheels = Get-ChildItem dist/*.whl
          foreach ($wheel in $wheels) {
            Write-Host "Checking $wheel for source code..."
            $content = python -m zipfile -l $wheel
            if ($content -match '\.rs$|Cargo\.toml') {
              Write-Host "ERROR: Rust source found in wheel!"
              exit 1
            } else {
              Write-Host "✓ Clean - no source code detected"
            }
          }
        shell: powershell
      
      - name: List wheel contents
        run: |
          cd python/dist
          ls -lh
        shell: bash
      
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: python/dist/*.whl
          retention-days: 30
      
      - name: Upload to release (if triggered by release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: python/dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  security-check:
    name: Final Security Verification
    needs: build-wheels
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-wheels
      
      - name: Comprehensive source code check
        run: |
          echo "Performing final security scan on all wheels..."
          find all-wheels -name "*.whl" -type f | while read wheel; do
            echo "Scanning: $wheel"
            unzip -l "$wheel" | grep -iE '\.rs$|\.toml$|crates/|/src/' && {
              echo "⚠️  WARNING: Potential source code found in $wheel"
              exit 1
            } || {
              echo "✓ $wheel is clean"
            }
          done
          echo "✅ All wheels passed security verification"
      
      - name: Generate wheel inventory
        run: |
          echo "# Build Artifacts" > inventory.md
          echo "" >> inventory.md
          echo "## Wheels Built" >> inventory.md
          find all-wheels -name "*.whl" -type f -exec basename {} \; | sort >> inventory.md
      
      - name: Upload inventory
        uses: actions/upload-artifact@v3
        with:
          name: build-inventory
          path: inventory.md

  publish-pypi:
    name: Publish to PyPI (Manual)
    needs: [build-wheels, security-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    # Remove 'if' condition to enable automatic publishing
    # WARNING: Only enable when PyPI credentials are configured
    # environment: pypi  # Uncomment to use GitHub environment secrets
    
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v3
        with:
          path: all-wheels
      
      - name: Collect wheels
        run: |
          mkdir -p dist
          find all-wheels -name "*.whl" -exec cp {} dist/ \;
          ls -lh dist/
      
      - name: Install twine
        run: pip install twine
      
      # OPTION 1: Manual approval required
      - name: Publish to PyPI (requires approval)
        if: false  # Change to 'true' to enable, requires PyPI token in secrets
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*.whl
      
      # OPTION 2: Instructions for manual publishing
      - name: Manual publishing instructions
        run: |
          echo "::notice::Wheels built successfully. To publish manually:"
          echo "::notice::1. Download the wheels from the Actions artifacts"
          echo "::notice::2. Run: twine upload *.whl"
          echo "::notice::3. Or use: ./python/publish_wheels.sh"
