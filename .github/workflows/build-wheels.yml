name: Release to PyPI
# Multi-platform, multi-version wheel builds
# Uses PyO3/maturin-action for manylinux-compliant Linux wheels
# Publishes via pypa/gh-action-pypi-publish using PYPI_TOKEN secret

on:
  release:
    # 'published' fires for new releases and pre-releases moved out of draft,
    # but NOT for draft releases. Use 'created' if drafts should also trigger.
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Linux wheels (manylinux via Docker) ────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --strip --out dist --interpreter 3.10 3.11 3.12 3.13
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist/*.whl

  # ── macOS wheels ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: macos-13
          - target: aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist --interpreter 3.10 3.11 3.12 3.13
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist/*.whl

  # ── Windows wheels ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --strip --out dist --interpreter 3.10 3.11 3.12 3.13
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: python/dist/*.whl

  # ── Security verification ──────────────────────────────────────────
  verify:
    name: Verify wheels
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Verify no source code in wheels
        run: |
          echo "Scanning all wheels for source code leaks..."
          for wheel in dist/*.whl; do
            echo "Checking $wheel..."
            unzip -l "$wheel" | grep -iE '\.rs$|Cargo\.toml|crates/|build\.rs' && {
              echo "ERROR: Source code found in $wheel"
              exit 1
            } || echo "✓ Clean"
          done
          echo "✅ All wheels passed security verification"

      - name: List all wheels
        run: |
          echo "## Built wheels"
          ls -lh dist/*.whl
          echo ""
          echo "Total: $(ls dist/*.whl | wc -l) wheels"

  # ── Attach wheels to GitHub Release ────────────────────────────────
  release-upload:
    name: Upload to GitHub Release
    needs: [verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  # ── Publish to PyPI ──────────────────────────────────────────────────
  # Uses PYPI_TOKEN secret for authentication.
  # To migrate to Trusted Publishing (OIDC) later, remove the password
  # field and configure a Trusted Publisher on PyPI:
  #   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
  publish:
    name: Publish to PyPI
    needs: [verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/neleus
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
