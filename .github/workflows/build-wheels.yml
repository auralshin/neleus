name: Release to PyPI
# Multi-platform, multi-version wheel builds
# Uses PyO3/maturin-action for manylinux-compliant Linux wheels
# Publishes via pypa/gh-action-pypi-publish using Trusted Publishing (OIDC)

on:
  release:
    # 'published' fires for new releases and pre-releases moved out of draft,
    # but NOT for draft releases. Use 'created' if drafts should also trigger.
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'python/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/build-wheels.yml'

permissions:
  contents: read

jobs:
  # ── Linux wheels (manylinux via Docker) ────────────────────────────
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --strip --out dist --interpreter 3.10 3.11 3.12 3.13 --manifest-path ../crates/pybridge/Cargo.toml
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: python/dist/*.whl

  # ── macOS wheels ───────────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: macos-latest
          - target: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist --find-interpreter --manifest-path ../crates/pybridge/Cargo.toml
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist/*.whl

  # ── Windows wheels ─────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: x86_64
          args: --release --strip --out dist --find-interpreter --manifest-path ../crates/pybridge/Cargo.toml
          working-directory: python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: python/dist/*.whl

  # ── Security verification ──────────────────────────────────────────
  verify:
    name: Verify wheels
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Verify no source code in wheels
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "ERROR: No wheels found in dist/"
            exit 1
          fi
          echo "Scanning ${#wheels[@]} wheel(s) for source code leaks..."
          for wheel in "${wheels[@]}"; do
            echo "Checking $wheel..."
            if unzip -l "$wheel" | grep -iE '\.rs$|Cargo\.toml|crates/|build\.rs'; then
              echo "ERROR: Source code found in $wheel"
              exit 1
            fi
            echo "✓ Clean"
          done
          echo "✅ All wheels passed security verification"

      - name: List all wheels
        run: |
          echo "## Built wheels"
          ls -lh dist/*.whl
          echo ""
          echo "Total: $(ls dist/*.whl | wc -l) wheels"

  # ── Attach wheels to GitHub Release ────────────────────────────────
  release-upload:
    name: Upload to GitHub Release
    needs: [verify]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.whl

  # ── Publish to PyPI ──────────────────────────────────────────────────
  # Uses Trusted Publishing (OIDC) for secure authentication without tokens.
  # Trusted Publisher must be configured on PyPI for this repo:
  #   https://pypi.org/manage/project/neleus/settings/publishing/
  publish:
    name: Publish to PyPI
    needs: [verify]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for Trusted Publishing
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
